# Library service: Spring Boot 2.7 configuration
server.port=8080
server.compression.enabled=true

logging.level.com.acme.library=INFO

# Database: in-memory H2, no external services needed.
spring.datasource.url=jdbc:h2:mem:library;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true

# Library settings (bound by LibraryProperties)
library.loan-days=14
library.max-active-loans=5
library.fine-per-day=0.25
library.reservation-hold-days=3
library.isbn-lookup-url=https://openlibrary.org/isbn/{isbn}.json
library.scheduling-enabled=true
library.overdue-cron=0 0 2 * * *
